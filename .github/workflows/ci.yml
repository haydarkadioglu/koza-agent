name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Run Ruff (errors)
      run: ruff check . --select E9,F821
    # The full ruleset has ~1.6k pre-existing findings; tracked as a follow-up, so this reports but does not block.
    - name: Run Ruff (full)
      run: ruff check .
      continue-on-error: true
    - name: Run Mypy
      # No mypy baseline yet.
      run: mypy .
      continue-on-error: true
    - name: Run Pytest
      run: python -m pytest tests -q
